# Keeps Supabase in step with the repo:
#  1. applies lasso edits Dan saved from the editor, and commits them here
#  2. uploads photos/masks and the mini list to Supabase
# Runs on every push, every 3 hours (which also stops the free project pausing),
# and on demand from the Actions tab ("Run workflow").
# Does nothing until the SUPABASE_SECRET_KEY repository secret is added.

name: Supabase sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "SUPABASE_SECRET_KEY secret not set; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Apply saved editor edits
        if: steps.setup.outputs.ready == 'true'
        run: |
          pip install -q -r tools/requirements.txt
          python3 tools/sync_supabase.py pull-edits
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "swatchwork-sync"
            git config user.email "swatchwork-sync@users.noreply.github.com"
            git add -A
            git commit -m "Apply lasso edits saved from the editor"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload to Supabase
        if: steps.setup.outputs.ready == 'true'
        run: python3 tools/sync_supabase.py push
